<title>BrainADZ HRMS + Projects</title>
<style>
  /* Layout: the two real apps fill the screen, one at a time; a small switcher floats at the
     bottom once both are open. Only the switcher, notices and loading screen are this page's own. */
  :root {
    --paper: #f3f6fb;
    --ink: #1b2848;
    --muted: #5b6a82;
    --pill: #1f2b7b;
    --pill-ink: #ffffff;
    --pill-soft: rgba(255, 255, 255, 0.16);
    --accent: #e31b3b;
    --card: #ffffff;
    --line: #dde4ef;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --paper: #0e1326;
      --ink: #e6eaf5;
      --muted: #9aa5c2;
      --pill: #2a3790;
      --card: #171e38;
      --line: #2a3459;
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --paper: #0e1326;
    --ink: #e6eaf5;
    --muted: #9aa5c2;
    --pill: #2a3790;
    --card: #171e38;
    --line: #2a3459;
    color-scheme: dark;
  }
  html,
  body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    overflow: hidden;
  }
  .app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--paper);
  }
  [hidden] {
    display: none !important;
  }

  /* Switching between the two apps */
  .switch {
    position: fixed;
    left: 50%;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 4px 4px 12px;
    border-radius: 999px;
    background: var(--pill);
    color: var(--pill-ink);
    box-shadow: 0 8px 28px rgba(16, 24, 40, 0.28);
    font-size: 13px;
    white-space: nowrap;
  }
  .switch .tag {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.75;
    margin-right: 8px;
  }
  .switch b {
    font-weight: 800;
    letter-spacing: -0.2px;
    margin-right: 6px;
  }
  .switch button {
    border: 0;
    border-radius: 999px;
    padding: 7px 14px;
    background: transparent;
    color: var(--pill-ink);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .switch button[aria-pressed='true'] {
    background: var(--pill-ink);
    color: var(--pill);
  }
  .switch button:not([aria-pressed='true']):hover {
    background: var(--pill-soft);
  }
  .switch button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Messages from this page (no Projects account, a refused pass) */
  .notice {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    width: min(460px, calc(100% - 32px));
    box-sizing: border-box;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 14px 14px 14px 16px;
    border-radius: 14px;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    box-shadow: 0 12px 40px rgba(16, 24, 40, 0.22);
    font-size: 14px;
    line-height: 1.45;
  }
  .notice p {
    margin: 0;
    flex: 1;
    min-width: 0;
  }
  .notice button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    padding: 0 2px;
  }

  /* While Projects opens */
  .opening {
    position: fixed;
    inset: 0;
    z-index: 15;
    display: grid;
    place-content: center;
    gap: 14px;
    justify-items: center;
    background: var(--paper);
    color: var(--muted);
    font-size: 15px;
    font-weight: 600;
  }
  .opening .bar {
    width: 200px;
    height: 4px;
    border-radius: 4px;
    background: var(--line);
    overflow: hidden;
  }
  .opening .bar::after {
    content: '';
    display: block;
    width: 40%;
    height: 100%;
    border-radius: 4px;
    background: var(--accent);
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide {
    from {
      transform: translateX(-100%);
    }
    to {
      transform: translateX(250%);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .opening .bar::after {
      animation: none;
      width: 100%;
    }
  }
  /* Phones: clear the apps' bottom tab bars */
  @media (max-width: 760px) {
    .switch {
      bottom: calc(80px + env(safe-area-inset-bottom, 0px));
    }
  }
</style>

<iframe
  class="app"
  id="hrms"
  name="brainadz-suite"
  src="hrms.html#suite"
  title="BrainADZ HRMS"
></iframe>
<div class="opening" id="opening" hidden>
  <span>Opening BrainADZ Projects…</span>
  <div class="bar"></div>
</div>
<div class="switch" id="switch" role="group" aria-label="Switch app" hidden>
  <span class="tag" title="Fictional data, kept in this browser">Demo</span>
  <b>BrainADZ</b>
  <button type="button" id="to-hrms" aria-pressed="true">HRMS</button>
  <button type="button" id="to-projects" aria-pressed="false">Projects</button>
</div>
<div class="notice" id="notice" role="alert" hidden>
  <p id="notice-text"></p>
  <button type="button" id="notice-close" aria-label="Close">×</button>
</div>

<script>
  (function () {
    // Same demo-only secret as the HRMS demo's suite mode; the real apps use SSO_SECRET.
    var SECRET = 'brainadz-suite-demo-secret-not-for-real-use';
    var hrms = document.getElementById('hrms');
    var projects = null;
    var opening = document.getElementById('opening');
    var sw = document.getElementById('switch');
    var toHrms = document.getElementById('to-hrms');
    var toProjects = document.getElementById('to-projects');
    var notice = document.getElementById('notice');
    var used = {};
    var hideNotice;

    function say(text) {
      document.getElementById('notice-text').textContent = text;
      notice.hidden = false;
      clearTimeout(hideNotice);
      hideNotice = setTimeout(function () {
        notice.hidden = true;
      }, 9000);
    }
    document.getElementById('notice-close').addEventListener('click', function () {
      notice.hidden = true;
    });

    // Shows one app and marks it in the switcher.
    function show(app) {
      hrms.hidden = app !== 'hrms';
      if (projects) projects.hidden = app !== 'projects';
      toHrms.setAttribute('aria-pressed', String(app === 'hrms'));
      toProjects.setAttribute('aria-pressed', String(app === 'projects'));
    }
    toHrms.addEventListener('click', function () {
      show('hrms');
    });
    toProjects.addEventListener('click', function () {
      show('projects');
    });

    // The Projects demo. Its frame's name tells it who to sign in as (a name survives reloads and
    // needs no storage, which some browsers block here); it answers with a message.
    // A fresh frame each time: browsers only apply a name given before the frame is created.
    function openProjectsAs(email) {
      if (projects) projects.remove();
      projects = document.createElement('iframe');
      projects.className = 'app';
      projects.title = 'BrainADZ Projects';
      projects.name = 'brainadz-suite:' + email;
      projects.hidden = true;
      projects.src = 'projects.html';
      document.body.insertBefore(projects, opening);
    }

    // base64url text to bytes.
    function bytes(s) {
      var bin = atob(s.replace(/-/g, '+').replace(/_/g, '/'));
      var out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    // The same checks the real Projects server makes: signature, issuer and audience, one
    // minute, and one use.
    async function readPass(token) {
      var parts = String(token || '').split('.');
      if (parts.length !== 2) return null;
      var enc = new TextEncoder();
      var key = await crypto.subtle.importKey(
        'raw',
        enc.encode(SECRET),
        { name: 'HMAC', hash: 'SHA-256' },
        false,
        ['verify'],
      );
      var genuine = await crypto.subtle.verify('HMAC', key, bytes(parts[1]), enc.encode(parts[0]));
      if (!genuine) return null;
      var claims = JSON.parse(new TextDecoder().decode(bytes(parts[0])));
      var t = Math.floor(Date.now() / 1000);
      if (claims.iss !== 'brainadz-hrms' || claims.aud !== 'brainadz-projects') return null;
      if (!claims.email || !claims.jti || used[claims.jti]) return null;
      if (!(claims.exp >= t - 5) || !(claims.iat <= t + 30)) return null;
      used[claims.jti] = true;
      return claims;
    }

    var waiting = null;
    function done() {
      clearTimeout(waiting);
      waiting = null;
      opening.hidden = true;
    }

    window.addEventListener('message', async function (e) {
      var d = e.data || {};
      // The Projects demo: signed in, or that person isn't in Projects.
      if (projects && e.source === projects.contentWindow && d.type === 'brainadz:projects') {
        if (!waiting) return;
        done();
        if (d.ok) {
          show('projects');
          // Both apps are open now: the switcher appears.
          sw.hidden = false;
        } else {
          say(
            d.email +
              " doesn't have access to BrainADZ Projects yet. Ask a Projects admin to add you under Team & Access.",
          );
        }
        return;
      }
      // The HRMS asked to open Projects with a pass.
      if (e.source !== hrms.contentWindow || d.type !== 'brainadz:open') return;
      var claims = await readPass(String(d.url || '').split('#sso=')[1]);
      if (!claims) return say('That sign-in link has expired. Sign in again.');
      opening.hidden = false;
      clearTimeout(waiting);
      waiting = setTimeout(function () {
        done();
        say('BrainADZ Projects could not open. Reload the page and try again.');
      }, 60000);
      openProjectsAs(String(claims.email).toLowerCase());
    });
  })();
</script>
